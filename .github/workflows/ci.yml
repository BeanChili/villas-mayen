name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: villasmayen
          POSTGRES_PASSWORD: villasmayen
          POSTGRES_DB: villasmayen_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U villasmayen"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://villasmayen:villasmayen@localhost:5432/villasmayen_test
      TEST_DATABASE_URL: postgresql://villasmayen:villasmayen@localhost:5432/villasmayen_test
      NEXTAUTH_SECRET: ci-secret
      NEXTAUTH_URL: http://localhost:3000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Prisma generate
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Tests unitarios
        run: npm run test

      - name: Tests de integracion
        run: npm run test:integration

      - name: Build
        run: npm run build

# Los E2E de Playwright no corren en CI: necesitan la app levantada con una
# base seedeada. Correr localmente con npm run test:e2e.
